{% extends "admin_tools/dashboard/module.html" %}
{% load static %}
{% block module_content %}
<div style="height: {{ module.height }}px;">
	<script type="text/javascript" src='{% static "admin_tools_widgets/chart.js/_dist/chart.umd.js" %}'></script>
	<script type="text/javascript" src='{% static "admin_tools_widgets/chartjs-adapter-date-fns/_dist/chartjs-adapter-date-fns.bundle.min.js" %}'></script>

	<div style="margin-top: -20px; display:flex; width: 100%">
		<select id="timeUnit-{{ module.id }}" style="padding: 4px 8px;border-radius: 8px;background: white;color: black;margin-left: auto;" onchange="updateChart_{{ module.id }}()">
			<option value="day">День</option>
			<option value="week">Неделя</option>
			<option value="month">Месяц</option>
		</select>
	</div>

	<canvas id="lineChart-{{ module.id }}"></canvas>
	<script>
		const initial_data_{{ module.id }} = JSON.parse('{{ module.data|safe }}');
		let chart_{{ module.id }};

		function aggregateData_{{ module.id }}(timeUnit) {
			if (!initial_data_{{ module.id }}.datasets) {
				return { labels: [], datasets: [] };
			}

			const aggregatedData = initial_data_{{ module.id }}.datasets.map(dataset => {
				const dataMap = new Map();

				if (!dataset.data) {
					return { ...dataset, data: [] };
				}

				dataset.data.forEach((point, index) => {
					let date;
					let value;

					// Handle different data formats
					if (typeof point === 'object' && point.x !== undefined) {
						date = new Date(point.x);
						value = point.y || 0;
					} else if (initial_data_{{ module.id }}.labels && initial_data_{{ module.id }}.labels[index]) {
						date = new Date(initial_data_{{ module.id }}.labels[index]);
						value = typeof point === 'object' ? (point.y || point) : point;
					} else {
						return; // Skip if we can't determine date
					}

					if (isNaN(date.getTime())) {
						return; // Skip invalid dates
					}

					let key;

					if (timeUnit === 'week') {
						const weekStart = new Date(date);
						weekStart.setDate(date.getDate() - date.getDay());
						key = weekStart.toISOString().split('T')[0];
					} else if (timeUnit === 'month') {
						key = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
					} else {
						key = date.toISOString().split('T')[0];
					}

					if (!dataMap.has(key)) {
						dataMap.set(key, 0);
					}

					dataMap.set(key, dataMap.get(key) + (Number(value) || 0));
				});

				const aggregatedPoints = Array.from(dataMap.entries()).map(([key, value]) => ({
					x: key,
					y: value
				})).sort((a, b) => new Date(a.x) - new Date(b.x));

				return {
					...dataset,
					data: aggregatedPoints
				};
			});

			return {
				labels: aggregatedData[0]?.data.map(point => point.x) || [],
				datasets: aggregatedData
			};
		}

		function updateChart_{{ module.id }}() {
			const timeUnit = document.getElementById('timeUnit-{{ module.id }}').value;
			const aggregatedData = aggregateData_{{ module.id }}(timeUnit);

			chart_{{ module.id }}.data = {
				labels: aggregatedData.labels,
				datasets: aggregatedData.datasets.map(set => ({
					label: set.title || set.label,
					data: set.data,
					fill: false,
					tension: 0.1
				}))
			};

			if (chart_{{ module.id }}.options.scales.x.time) {
				chart_{{ module.id }}.options.scales.x.time.unit = timeUnit;
			}
			chart_{{ module.id }}.update();
		}

		chart_{{ module.id }} = new Chart(
			document.getElementById('lineChart-{{ module.id }}'),
			{
				type: '{{ module.visual_type }}',
				data: {
					labels: initial_data_{{ module.id }}.labels,
					datasets: initial_data_{{ module.id }}.datasets.map(set => ({
						label: set.title || set.label,
						data: set.data,
						fill: false,
						// borderColor: 'rgb(75, 192, 192)',
						tension: 0.1
					}))
				},
				options: {
					maintainAspectRatio: false,
					responsive: true,
					scales: {
						x: {
							type: 'time',
							time: {
								unit: 'day'
								// displayFormats: {
								//     quarter: 'MMM YYYY'
								// }
							}
						}
					}
				}
			}
		);
	</script>
</div>
{% endblock %}
